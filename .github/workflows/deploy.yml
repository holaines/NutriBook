name: Deploy to GitHub Pages + Supabase

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Déploie la table rak_menus et la Edge Function rak-fetch
  # Nécessite le secret SUPABASE_ACCESS_TOKEN (token personnel depuis
  # https://supabase.com/dashboard/account/tokens)
  deploy-supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create rak_menus table (idempotent)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          curl --fail -X POST \
            "https://api.supabase.com/v1/projects/cyewzqlkjbvsllotaywu/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -Rs '{query: .}' < rak.sql)"

      - name: Set GEMINI_KEY secret on Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: supabase secrets set GEMINI_KEY="$GEMINI_KEY" --project-ref cyewzqlkjbvsllotaywu

      - name: Deploy rak-fetch Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy rak-fetch --project-ref cyewzqlkjbvsllotaywu

      - name: Deploy iron-estimate Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy iron-estimate --project-ref cyewzqlkjbvsllotaywu

  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4

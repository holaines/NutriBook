name: Deploy to GitHub Pages + Supabase

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Déploie la table rak_menus et la Edge Function rak-fetch
  # Nécessite le secret SUPABASE_ACCESS_TOKEN (token personnel depuis
  # https://supabase.com/dashboard/account/tokens)
  deploy-supabase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create rak_menus table (idempotent)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db execute --project-ref cyewzqlkjbvsllotaywu -f rak.sql

      - name: Deploy rak-fetch Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy rak-fetch --project-ref cyewzqlkjbvsllotaywu

  deploy-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject Gemini key
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          sed -i "s|geminiKey: ''|geminiKey: '${GEMINI_KEY}'|" supabase-config.js

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4

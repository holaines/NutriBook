<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NutriBook · Tu cocina, a tu manera</title><style>
:root{--sage:#526e5c;--sage2:#e6ece3;--cream:#faf8f2;--ink:#24352c;--muted:#718077;--line:#e5e7de;--terra:#b66d4f;--white:#fff;--shadow:0 8px 28px #273b3011}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--cream);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #9fb9a6;outline-offset:2px}.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.sidebar{background:#f0f2ea;border-right:1px solid var(--line);padding:27px 17px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.logo{font-family:Georgia,serif;font-size:30px;margin:0 10px 35px;color:var(--sage)}.logo span{color:var(--terra)}.nav{display:grid;gap:5px}.nav button{border:0;text-align:left;padding:13px 14px;border-radius:13px;background:transparent;color:#56685d;font-size:14px}.nav button.active,.nav button:hover{background:#fff;color:var(--sage);font-weight:750}.nav button span{display:inline-block;width:27px}.side-foot{margin-top:auto;color:var(--muted);font-size:12px;padding:15px;line-height:1.6}.main{padding:35px clamp(20px,5vw,70px) 65px;max-width:1600px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:25px}.eyebrow{color:var(--terra);font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}h1,h2,h3{font-family:Georgia,serif;font-weight:500;margin:6px 0 12px}h1{font-size:clamp(30px,3.7vw,46px)}h2{font-size:27px}h3{font-size:22px}.muted{color:var(--muted)}.small{font-size:12px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:11px 15px;font-weight:650}.btn:hover{border-color:var(--sage)}.btn.primary{background:var(--sage);color:white;border-color:var(--sage)}.btn.terra{background:var(--terra);color:white;border-color:var(--terra)}.btn.danger{color:#a43c3c}.btn.ghost{background:transparent}.buttons{display:flex;gap:9px;flex-wrap:wrap}.hero{display:grid;grid-template-columns:1fr 280px;align-items:center;overflow:hidden;min-height:220px;background:#e4eadf;border-radius:22px;padding:30px 36px;gap:15px;margin-bottom:22px}.hero h2{font-size:34px;line-height:1.12;max-width:650px}.hero p{max-width:560px}.hero-art{font-size:104px;text-align:center;filter:drop-shadow(0 12px 10px #24352c22)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.card{background:white;border:1px solid #e8eae3;border-radius:18px;padding:21px;box-shadow:var(--shadow)}.metric{font-size:31px;font-family:Georgia,serif;color:var(--sage)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:28px 0 15px}.recipe{padding:0;overflow:hidden}.recipe-cover{height:145px;display:flex;justify-content:center;align-items:center;background:linear-gradient(125deg,#e7ede0,#f5ebe0);font-size:70px}.recipe-body{padding:17px}.recipe h3{font-size:21px;margin:0 0 8px}.tags{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0}.tag{font-size:11px;border-radius:99px;background:#edf1e9;color:#536b56;padding:5px 9px}.recipe-meta{font-size:12px;color:var(--muted);display:flex;gap:13px;margin:12px 0}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:17px 0}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:750;color:#617166}.field input,.field select,.field textarea,.toolbar input,.toolbar select{width:100%;padding:11px;border:1px solid #dfe5db;border-radius:10px;background:#fff;color:var(--ink)}.toolbar input{min-width:160px;flex:2}.toolbar select{min-width:145px;flex:1}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.form-grid .wide{grid-column:1/-1}textarea{min-height:100px;resize:vertical}.empty{text-align:center;padding:48px 20px;background:#fff;border:1px dashed #cddacc;border-radius:18px;color:var(--muted)}.empty strong{display:block;font-family:Georgia,serif;color:var(--sage);font-size:25px;margin-bottom:9px}.week-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(145px,1fr));gap:10px;overflow-x:auto}.day{background:#fff;border:1px solid var(--line);border-radius:15px;padding:11px;min-height:320px}.day.today{border:2px solid var(--sage)}.day-title{font-size:13px;font-weight:750;margin-bottom:12px}.day-date{font-size:24px;font-family:Georgia,serif}.slot{margin:12px 0}.slot-label{font-size:11px;color:var(--muted);margin-bottom:5px}.slot select{max-width:100%;font-size:11px;padding:8px 4px;border:1px solid #dfe5db;border-radius:8px;background:#f8faf6;color:var(--ink)}.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item small{display:block;color:var(--muted);margin-top:3px}.check{accent-color:var(--sage);width:16px;height:16px}.notice{padding:13px 16px;border:1px solid #e6e3d3;background:#f9f5e9;border-radius:12px;color:#716343;font-size:13px;margin:15px 0}.modal-bg{position:fixed;inset:0;background:#14221999;display:flex;align-items:center;justify-content:center;z-index:10;padding:15px}.modal{background:white;border-radius:20px;width:min(740px,100%);max-height:92vh;overflow:auto;padding:28px}.modal .top{margin:0 0 18px}.close{border:0;background:transparent;font-size:25px}.pill{border-radius:50px;padding:7px 11px;background:#edf1e9;font-size:12px}.split{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}.chip{padding:9px 13px;background:#f1f5ee;border-radius:9px;display:inline-block;margin:3px;font-size:12px}.footer{margin-top:40px;color:#7e8980;font-size:12px}.line{border:0;border-top:1px solid var(--line);margin:18px 0}.recipe-detail ol{padding-left:22px;line-height:1.8}.nutrient{display:grid;grid-template-columns:90px 1fr 55px;gap:10px;align-items:center;font-size:13px;margin:12px 0}.bar{height:9px;border-radius:99px;background:#e8ede6;overflow:hidden}.bar>span{display:block;height:100%;background:#72967b}.info{font-size:12px;line-height:1.6}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.calendar{grid-template-columns:repeat(7,165px)}}@media(max-width:750px){.app{display:block}.sidebar{height:auto;position:sticky;z-index:5;top:0;padding:8px;border-bottom:1px solid var(--line)}.logo{font-size:24px;margin:5px 10px}.nav{display:flex;overflow:auto;gap:2px}.nav button{white-space:nowrap;font-size:12px;padding:9px}.nav button span{width:auto;margin-right:5px}.side-foot{display:none}.main{padding:24px 15px 60px}.grid,.grid.two,.split,.hero{grid-template-columns:1fr}.hero{padding:24px}.hero-art{display:none}.form-grid{grid-template-columns:1fr}.top{align-items:flex-start}.buttons{align-items:center}}
</style></head><body><div id="app"></div><script>
'use strict';const KEY='nutribook-local-v1';const cats=['Desayunos','Comidas','Cenas','Meriendas','Snacks','Aperitivos','Entrantes','Ensaladas','Sopas y cremas','Guarniciones','Postres','Bebidas','Salsas','Batch cooking'];const meals=['Desayuno','Comida','Cena','Merienda'];const icons={Inicio:'⌂',Recetas:'◉',Calendario:'▦',Despensa:'▤',Compra:'▧',Equilibrio:'♡',Perfil:'♙'};const eid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const today=()=>new Date().toLocaleDateString('en-CA');const money=n=>Number(n||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'});const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const defaults={recipes:[],pantry:[],plan:{},checked:{},profile:{name:'',goal:'Alimentación equilibrada',priorities:'Hierro, vitamina C, proteínas',budget:'',notes:''}};let state=load(),page='Inicio',search='',cat='',maxTime='',ingredientFilter='',weekOffset=0,selectedRecipe=null,modal=null;function load(){try{let d=JSON.parse(localStorage.getItem(KEY));return d?{...structuredClone(defaults),...d}:structuredClone(defaults)}catch{return structuredClone(defaults)}}function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('No queda espacio de almacenamiento. Exporta tus datos para conservarlos.')}}function datePlus(d,n){let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toLocaleDateString('en-CA')}function weekStart(){let d=today(),x=new Date(d+'T12:00:00'),shift=(x.getDay()+6)%7;return datePlus(d,-shift+weekOffset*7)}function sub(text){return String(text||'').split('\n').map(s=>s.trim()).filter(Boolean)}function parseIngredients(t){return sub(t).map(s=>{let m=s.match(/^([\d.,/½¼¾]+)\s*(g|kg|ml|l|ud|unidades|cucharadas?|cucharaditas?|tazas?|pizca|dientes?)?\s*(?:de\s+)?(.+)$/i);if(!m)return {name:s,quantity:null,unit:''};let qty=m[1].includes('/')?m[1].split('/').reduce((a,b)=>Number(a)/Number(b)):({'½':.5,'¼':.25,'¾':.75}[m[1]]??Number(m[1].replace(',','.')));return {name:m[3],quantity:qty,unit:m[2]||'ud'}})}function ingredientText(r,mult=1){return (r.ingredients||[]).map(i=>`${i.quantity==null?'':Number((i.quantity*mult).toFixed(2))+' '+i.unit+' '}${i.name}`).join('\n')};function navigate(p){page=p;modal=null;render()}function top(title,desc,actions=''){return `<div class="top"><div><div class="eyebrow">NutriBook · cocina consciente</div><h1>${title}</h1><div class="muted">${desc}</div></div><div class="buttons">${actions}</div></div>`}function recipeCard(r){return `<article class="card recipe"><div class="recipe-cover">${h(r.emoji||'🥗')}</div><div class="recipe-body"><h3>${h(r.name)}</h3><div class="tags">${(r.categories||[]).slice(0,2).map(c=>`<span class="tag">${h(c)}</span>`).join('')}${r.favorite?'<span class="tag">★ Favorita</span>':''}</div><div class="recipe-meta"><span>◷ ${Number(r.time||0)} min</span><span>♧ ${Number(r.servings||1)} raciones</span></div><div class="buttons"><button class="btn primary" onclick="viewRecipe('${r.id}')">Ver receta</button><button class="btn" onclick="toggleFav('${r.id}')">${r.favorite?'★':'☆'}</button></div></div></article>`}function home(){let date=today();let curr=meals.map(m=>[m,state.plan[date+'|'+m]]).filter(x=>x[1]);return top('Tu cocina, a tu manera','Recetas, ingredientes y menús en un mismo lugar.',`<button class="btn primary" onclick="openForm()">+ Añadir receta</button>`)+`<section class="hero"><div><div class="eyebrow">Bienvenida a tu recetario</div><h2>Come variado. Cocina con calma. Organízate mejor.</h2><p class="muted">Guarda tus recetas favoritas y decide qué cocinar con los ingredientes que ya tienes.</p><button class="btn terra" onclick="navigate('Calendario')">Planificar mi semana →</button></div><div class="hero-art">🥑🥕</div></section><div class="grid"><div class="card"><div class="muted small">RECETAS GUARDADAS</div><div class="metric">${state.recipes.length}</div></div><div class="card"><div class="muted small">EN MI DESPENSA</div><div class="metric">${state.pantry.length}</div></div><div class="card"><div class="muted small">COMIDAS PLANIFICADAS ESTA SEMANA</div><div class="metric">${Object.keys(state.plan).filter(k=>k.slice(0,10)>=weekStart()&&k.slice(0,10)<=datePlus(weekStart(),6)&&state.plan[k]).length}</div></div></div><div class="section-head"><h2>Hoy en tu menú</h2><button class="btn" onclick="navigate('Calendario')">Ver calendario</button></div><div class="card">${curr.length?curr.map(([m,id])=>`<div class="item"><span><b>${m}</b><small>${h(state.recipes.find(r=>r.id===id)?.name||'Receta eliminada')}</small></span></div>`).join(''):'Todavía no has planificado ninguna comida para hoy.'}</div><div class="section-head"><h2>Tus recetas recientes</h2><button class="btn" onclick="navigate('Recetas')">Ver todas →</button></div>${state.recipes.length?`<div class="grid">${[...state.recipes].reverse().slice(0,3).map(recipeCard).join('')}</div>`:empty('Tu recetario empieza aquí','Añade tu primera receta para empezar a organizar tu cocina.',`<button class="btn primary" onclick="openForm()">Añadir receta</button>`)}<div class="notice">Tus datos se guardan solo en este navegador. Exporta una copia desde «Perfil»; si borras los datos del navegador, se perderán.</div>`}function empty(title,txt,cta=''){return `<div class="empty"><strong>${title}</strong><p>${txt}</p>${cta}</div>`}function recipes(){let results=state.recipes.filter(r=>(!search||[r.name,r.description,ingredientText(r)].join(' ').toLowerCase().includes(search.toLowerCase()))&&(!cat||(r.categories||[]).includes(cat))&&(!maxTime||Number(r.time)<=Number(maxTime))&&(!ingredientFilter||(r.ingredients||[]).some(i=>i.name.toLowerCase().includes(ingredientFilter.toLowerCase()))));return top('Mi banco de recetas','Todas tus recetas, listas para encontrarlas.',`<button class="btn primary" onclick="openForm()">+ Nueva receta</button><button class="btn" onclick="openImport()">Pegar receta</button>`)+`<div class="toolbar"><input aria-label="Buscar recetas" placeholder="Buscar nombre o ingredientes..." value="${h(search)}" oninput="search=this.value;renderMain()"><select aria-label="Categoría" onchange="cat=this.value;renderMain()"><option value="">Todas las categorías</option>${cats.map(c=>`<option ${cat===c?'selected':''}>${c}</option>`).join('')}</select><select aria-label="Tiempo máximo" onchange="maxTime=this.value;renderMain()"><option value="">Cualquier duración</option>${[10,15,20,30,45,60].map(v=>`<option value="${v}" ${maxTime==v?'selected':''}>Hasta ${v} min</option>`).join('')}</select><input aria-label="Filtrar ingrediente" placeholder="Ingrediente incluido..." value="${h(ingredientFilter)}" oninput="ingredientFilter=this.value;renderMain()"></div>${results.length?`<div class="grid">${results.map(recipeCard).join('')}</div>`:empty('No hay recetas que mostrar',state.recipes.length?'Prueba con otros filtros.':'Empieza añadiendo la primera receta.')}`}function calendar(){let start=weekStart();return top('Mi planificación','Organiza desayunos, comidas, cenas y meriendas.',`<button class="btn" onclick="generateWeek()">Sugerir semana</button>`)+`<div class="week-head"><div class="buttons"><button class="btn" onclick="weekOffset--;render()">← Anterior</button><button class="btn" onclick="weekOffset=0;render()">Hoy</button><button class="btn" onclick="weekOffset++;render()">Siguiente →</button></div><strong>${new Date(start+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long'})} – ${new Date(datePlus(start,6)+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long',year:'numeric'})}</strong></div><div class="calendar">${Array.from({length:7},(_,j)=>{let d=datePlus(start,j),day=new Date(d+'T12:00:00');return `<div class="day ${d===today()?'today':''}"><div class="day-title">${day.toLocaleDateString('es-ES',{weekday:'long'})}</div><div class="day-date">${day.getDate()}</div>${meals.map(m=>`<div class="slot"><div class="slot-label">${m}</div><select aria-label="${m} ${d}" onchange="state.plan['${d}|${m}']=this.value;save();render()"><option value="">+ Elegir receta</option>${state.recipes.map(r=>`<option value="${r.id}" ${state.plan[d+'|'+m]===r.id?'selected':''}>${h(r.name)}</option>`).join('')}</select></div>`).join('')}</div>`}).join('')}</div><div class="notice">La sugerencia semanal utiliza tus recetas guardadas y solo rellena espacios vacíos, previa confirmación. No sustituye una evaluación nutricional.</div><div class="section-head"><h2>Lista para este periodo</h2><button class="btn primary" onclick="navigate('Compra')">Ver lista de la compra →</button></div>`}function generateWeek(){if(!state.recipes.length){alert('Añade primero alguna receta.');return}if(!confirm('¿Rellenar los huecos libres de esta semana con recetas de tu colección?'))return;let start=weekStart();for(let i=0;i<7;i++)for(let j=0;j<meals.length;j++){let k=datePlus(start,i)+'|'+meals[j];if(!state.plan[k]){let prefer=state.recipes.filter(r=>(r.categories||[]).some(c=>j===0?c==='Desayunos':j===3?['Meriendas','Snacks'].includes(c):j===2?['Cenas','Comidas'].includes(c):['Comidas','Cenas'].includes(c)));let a=prefer.length?prefer:state.recipes;state.plan[k]=a[(i+j)%a.length].id}}save();render()}function pantry(){return top('Mi despensa','Organiza los ingredientes que ya tienes.',`<button class="btn primary" onclick="openPantry()">+ Añadir ingrediente</button>`)+`<div class="card">${state.pantry.length?state.pantry.map(p=>`<div class="item"><span><b>${h(p.name)}</b><small>${h(p.quantity)} ${h(p.unit)} ${p.expiry?'· Preferente / caducidad: '+h(p.expiry):''}</small></span><div class="buttons"><button class="btn" onclick="openPantry('${p.id}')">Editar</button><button class="btn danger" onclick="removePantry('${p.id}')">Quitar</button></div></div>`).join(''):empty('Tu despensa está vacía','Añade avena, garbanzos, lentejas o lo que tengas en casa.')}</div><div class="section-head"><h2>Ideas con lo que tienes</h2></div><div class="grid">${state.recipes.map(r=>({r,n:(r.ingredients||[]).filter(i=>state.pantry.some(p=>p.name.toLowerCase().includes(i.name.toLowerCase())||i.name.toLowerCase().includes(p.name.toLowerCase()))).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,6).map(x=>recipeCard(x.r)).join('')||'<div class="muted">Añade recetas e ingredientes para ver coincidencias.</div>'}</div>`}function shoppingItems(){let counts={};let start=weekStart();Object.entries(state.plan).filter(([k,id])=>k.slice(0,10)>=start&&k.slice(0,10)<=datePlus(start,6)&&id).forEach(([k,id])=>{let r=state.recipes.find(r=>r.id===id);if(!r)return;(r.ingredients||[]).forEach(i=>{let key=i.name.toLowerCase().trim()+'|'+(i.unit||'');if(!counts[key])counts[key]={name:i.name,unit:i.unit||'',quantity:0,unknown:0};if(i.quantity==null)counts[key].unknown++;else counts[key].quantity+=i.quantity})});return Object.entries(counts).map(([key,v])=>({...v,key}))}function shopping(){let items=shoppingItems();return top('Mi lista de la compra','Ingredientes agrupados de las recetas planificadas para la semana visible en el calendario.',`<button class="btn" onclick="copyShopping()">Copiar lista</button>`)+`<div class="card">${items.length?items.map(i=>{let p=state.pantry.find(p=>p.name.toLowerCase()===i.name.toLowerCase()&&p.unit===i.unit),left=i.quantity-(p?Number(p.quantity)||0:0);return `<div class="item"><label><input class="check" type="checkbox" ${state.checked[i.key]?'checked':''} onchange="state.checked['${h(i.key)}']=this.checked;save();render()"> <span style="${state.checked[i.key]?'text-decoration:line-through;opacity:.6':''}">${h(i.name)}</span><small>Necesario: ${Number(i.quantity.toFixed(2))} ${h(i.unit)}${p?' · En despensa: '+p.quantity+' '+h(p.unit):''}${i.unknown?' · '+i.unknown+' cantidad(es) no indicada(s)':''}</small></label><b>${Math.max(0,Number(left.toFixed(2)))} ${h(i.unit)}</b></div>`}).join(''):empty('No hay nada en la lista','Planifica alguna receta en el calendario y aparecerán aquí sus ingredientes.')}</div><div class="notice">Resta existencias solo cuando el nombre y la unidad coinciden exactamente. Revisa los resultados antes de comprar: no convierte automáticamente unidades distintas.</div>`}function copyShopping(){let list=shoppingItems().map(i=>`${i.name}: ${i.quantity} ${i.unit}`).join('\n');navigator.clipboard?.writeText(list).then(()=>alert('Lista copiada')).catch(()=>prompt('Copia tu lista:',list))||(!navigator.clipboard&&prompt('Copia tu lista:',list))}function equilibrium(){let start=weekStart(),plans=Object.entries(state.plan).filter(([k,id])=>k.slice(0,10)>=start&&k.slice(0,10)<=datePlus(start,6)&&id);let present=plans.map(([,id])=>state.recipes.find(r=>r.id===id)).filter(Boolean),hasValues=present.some(r=>r.iron!==''&&r.iron!=null);let total=present.reduce((a,r)=>a+(Number(r.iron)||0),0);return top('Mi equilibrio','Una vista de lo que has planificado, no de lo que necesariamente has consumido.')+`<div class="grid"><div class="card"><div class="muted small">COMIDAS PLANIFICADAS</div><div class="metric">${plans.length}</div></div><div class="card"><div class="muted small">RECETAS DIFERENTES</div><div class="metric">${new Set(present.map(r=>r.id)).size}</div></div><div class="card"><div class="muted small">HIERRO REGISTRADO EN LA SEMANA</div><div class="metric">${hasValues?total.toFixed(1)+' mg':'Sin datos'}</div></div></div><div class="section-head"><h2>Origen de los datos</h2></div><div class="card"><p>El contenido de hierro se suma <b>únicamente</b> cuando lo has introducido manualmente en cada receta. Las recetas sin datos de hierro no cuentan en el total; por tanto, el número no describe la ingesta total.</p><p class="muted">Pendiente de integrar una base nutricional oficial, controlar tamaños de porción reales y registrar comidas efectivamente consumidas.</p></div>`}function profile(){let p=state.profile;return top('Mi perfil','Tus preferencias y tus datos, bajo tu control.')+`<div class="card"><form onsubmit="event.preventDefault();saveProfile(this)"><div class="form-grid"><div class="field"><label>Nombre (opcional)</label><input name="name" value="${h(p.name)}"></div><div class="field"><label>Objetivo principal</label><select name="goal">${['Alimentación equilibrada','Mejorar rendimiento deportivo','Ganar masa muscular','Mantener peso','Otro'].map(o=>`<option ${o===p.goal?'selected':''}>${o}</option>`).join('')}</select></div><div class="field"><label>Nutrientes que quieres priorizar</label><input name="priorities" value="${h(p.priorities)}"></div><div class="field"><label>Presupuesto semanal (€)</label><input name="budget" type="number" min="0" value="${h(p.budget)}"></div><div class="field wide"><label>Preferencias, alergias y notas</label><textarea name="notes">${h(p.notes)}</textarea></div></div><div class="buttons" style="margin-top:15px"><button class="btn primary" type="submit">Guardar perfil</button></div></form></div><div class="section-head"><h2>Mis datos</h2></div><div class="card"><p class="muted">Los datos se almacenan localmente en este navegador, sin cuenta ni servidor. Exporta copias periódicas.</p><div class="buttons"><button class="btn primary" onclick="exportData()">↓ Exportar copia JSON</button><button class="btn" onclick="document.getElementById('import-json').click()">↑ Importar copia JSON</button><button class="btn danger" onclick="clearAll()">Eliminar todos mis datos</button><input id="import-json" type="file" accept="application/json" hidden onchange="importData(this)"></div></div>`}function saveProfile(form){state.profile=Object.fromEntries(new FormData(form));save();alert('Perfil guardado')}function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download='nutribook-copia-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),300)}async function importData(inp){let f=inp.files?.[0];if(!f)return;try{let d=JSON.parse(await f.text());if(!Array.isArray(d.recipes)||!Array.isArray(d.pantry)||typeof d.plan!=='object')throw 0;if(!confirm('Se reemplazarán los datos actuales. ¿Continuar?'))return;state={...structuredClone(defaults),...d};save();render()}catch{alert('No se pudo importar: archivo no compatible.')}}function clearAll(){if(confirm('¿Eliminar TODAS las recetas, el calendario y la despensa de este navegador?')){state=structuredClone(defaults);save();render()}}function renderMain(){let a=document.activeElement,idx=a?.getAttribute('aria-label'),pos=a?.selectionStart;document.getElementById('main').innerHTML=section();if(idx){let el=[...document.querySelectorAll('input')].find(x=>x.getAttribute('aria-label')===idx);if(el){el.focus();try{el.setSelectionRange(pos,pos)}catch{}}}}function section(){return ({Inicio:home,Recetas:recipes,Calendario:calendar,Despensa:pantry,Compra:shopping,Equilibrio:equilibrium,Perfil:profile}[page]||home)()}function render(){document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="logo">Nutri<span>Book</span> 🌿</div><nav class="nav">${Object.keys(icons).map(p=>`<button class="${p===page?'active':''}" onclick="navigate('${p}')"><span>${icons[p]}</span>${p==='Compra'?'Mi compra':p==='Equilibrio'?'Mi equilibrio':p==='Perfil'?'Mi perfil':p}</button>`).join('')}</nav><div class="side-foot">Hecho para cocinar a tu ritmo.<br>🌱 Datos privados en tu navegador.</div></aside><main class="main" id="main">${section()}<div class="footer">NutriBook · Versión local funcional · Las estimaciones nutricionales no sustituyen asesoramiento sanitario.</div></main></div><div id="modal-root"></div>`;if(modal)showModal(modal)}function showModal(markup){modal=markup;document.getElementById('modal-root').innerHTML=`<div class="modal-bg" onclick="closeModal(event)"><div class="modal" role="dialog" aria-modal="true">${markup}</div></div>`}function closeModal(ev){if(!ev||ev.target.classList.contains('modal-bg')){modal=null;document.getElementById('modal-root').innerHTML=''}}function openForm(id){let r=state.recipes.find(r=>r.id===id)||{name:'',description:'',emoji:'🥗',categories:[],ingredients:[],instructions:[],servings:4,time:30,iron:'',favorite:false};showModal(`<div class="top"><h2>${id?'Editar':'Añadir'} receta</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();saveRecipe(this,'${id||''}')"><div class="form-grid"><div class="field wide"><label>Nombre *</label><input name="name" required value="${h(r.name)}"></div><div class="field"><label>Categoría</label><select name="category">${cats.map(c=>`<option ${r.categories.includes(c)?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>Emoji para la portada</label><input name="emoji" value="${h(r.emoji)}"></div><div class="field"><label>Tiempo total (min)</label><input name="time" type="number" min="0" value="${h(r.time)}"></div><div class="field"><label>Raciones</label><input name="servings" type="number" min="1" value="${h(r.servings)}"></div><div class="field wide"><label>Descripción</label><input name="description" value="${h(r.description)}"></div><div class="field wide"><label>Ingredientes · uno por línea (p. ej. 200 g de lentejas coral)</label><textarea name="ingredients" rows="6" required>${h(ingredientText(r))}</textarea></div><div class="field wide"><label>Pasos · uno por línea</label><textarea name="instructions" rows="6" required>${h((r.instructions||[]).join('\n'))}</textarea></div><div class="field"><label>Hierro estimado por ración, en mg (opcional)</label><input name="iron" type="number" min="0" step="0.1" value="${h(r.iron)}"></div><div class="field"><label>Fuente / URL (opcional)</label><input name="source" value="${h(r.source||'')}"></div></div><p class="info muted">Los valores de hierro son introducidos por ti; la app no los verifica automáticamente.</p><div class="buttons"><button class="btn primary" type="submit">Guardar receta</button><button class="btn" type="button" onclick="closeModal()">Cancelar</button></div></form>`)}function saveRecipe(form,id){let f=Object.fromEntries(new FormData(form));let obj={id:id||eid(),name:f.name.trim(),description:f.description,emoji:f.emoji||'🥗',categories:[f.category],ingredients:parseIngredients(f.ingredients),instructions:sub(f.instructions),servings:Number(f.servings)||1,time:Number(f.time)||0,iron:f.iron===''?'':Number(f.iron),source:f.source,favorite:state.recipes.find(r=>r.id===id)?.favorite||false};if(id){state.recipes=state.recipes.map(r=>r.id===id?obj:r)}else state.recipes.push(obj);save();modal=null;render();page='Recetas';render()}function viewRecipe(id){let r=state.recipes.find(r=>r.id===id);if(!r)return;selectedRecipe=id;showModal(`<div class="top"><div><div class="eyebrow">${h((r.categories||[]).join(' · '))}</div><h2>${h(r.emoji)} ${h(r.name)}</h2></div><button class="close" onclick="closeModal()">×</button></div><p>${h(r.description)}</p><div class="buttons"><span class="pill">◷ ${r.time} min</span><span class="pill">🍽 ${r.servings} raciones</span>${r.iron!==''?`<span class="pill">Hierro aportado manualmente: ${r.iron} mg/ración</span>`:''}</div><hr class="line"><div class="field"><label>Escalar raciones</label><input type="number" min="1" value="${r.servings}" oninput="document.getElementById('ingredients-detail').innerText=scaledIngredients('${id}',Number(this.value))"></div><div class="split recipe-detail"><div><h3>Ingredientes</h3><div id="ingredients-detail" style="white-space:pre-line;line-height:1.9">${h(ingredientText(r))}</div></div><div><h3>Preparación</h3><ol>${r.instructions.map(x=>`<li>${h(x)}</li>`).join('')}</ol></div></div>${r.source?`<p class="small muted">Fuente: ${h(r.source)}</p>`:''}<hr class="line"><div class="buttons"><button class="btn primary" onclick="openForm('${id}')">Editar receta</button><button class="btn" onclick="duplicateRecipe('${id}')">Duplicar</button><button class="btn danger" onclick="deleteRecipe('${id}')">Eliminar</button></div>`)}function scaledIngredients(id,servings){let r=state.recipes.find(r=>r.id===id);return r?ingredientText(r,Math.max(1,servings)/r.servings):''}function toggleFav(id){let r=state.recipes.find(r=>r.id===id);if(r)r.favorite=!r.favorite;save();render()}function duplicateRecipe(id){let r=state.recipes.find(r=>r.id===id);if(r){state.recipes.push({...structuredClone(r),id:eid(),name:r.name+' (copia)'});save();modal=null;render()}}function deleteRecipe(id){if(!confirm('¿Eliminar esta receta?'))return;state.recipes=state.recipes.filter(r=>r.id!==id);Object.keys(state.plan).forEach(k=>{if(state.plan[k]===id)delete state.plan[k]});save();modal=null;render()}function openPantry(id){let p=state.pantry.find(p=>p.id===id)||{name:'',quantity:'',unit:'g',expiry:''};showModal(`<div class="top"><h2>${id?'Editar':'Añadir'} ingrediente</h2><button class="close" onclick="closeModal()">×</button></div><form onsubmit="event.preventDefault();savePantry(this,'${id||''}')"><div class="form-grid"><div class="field wide"><label>Ingrediente</label><input name="name" required value="${h(p.name)}"></div><div class="field"><label>Cantidad</label><input name="quantity" type="number" min="0" step="any" required value="${h(p.quantity)}"></div><div class="field"><label>Unidad</label><select name="unit">${['g','kg','ml','l','ud'].map(u=>`<option ${p.unit===u?'selected':''}>${u}</option>`).join('')}</select></div><div class="field wide"><label>Fecha límite / consumo preferente (opcional)</label><input type="date" name="expiry" value="${h(p.expiry)}"></div></div><div class="buttons" style="margin-top:15px"><button class="btn primary">Guardar</button></div></form>`)}function savePantry(form,id){let f=Object.fromEntries(new FormData(form));let p={id:id||eid(),...f};state.pantry=id?state.pantry.map(x=>x.id===id?p:x):[...state.pantry,p];save();modal=null;render()}function removePantry(id){state.pantry=state.pantry.filter(p=>p.id!==id);save();render()}function openImport(){showModal(`<div class="top"><h2>Pegar una receta</h2><button class="close" onclick="closeModal()">×</button></div><p class="muted">Pega una receta con nombre, «Ingredientes» y «Preparación». Revisa los campos detectados antes de guardar.</p><textarea id="raw-recipe" style="width:100%;min-height:250px" placeholder="Galletas de avena\nIngredientes\n120 g de avena\n1 plátano\nPreparación\nMezclar todo.\nHornear 20 minutos."></textarea><div class="buttons" style="margin-top:15px"><button class="btn primary" onclick="parseImport()">Extraer receta</button></div>`)}function parseImport(){let t=document.getElementById('raw-recipe').value,rows=sub(t);if(!rows.length){alert('Pega una receta primero');return}let start=rows.findIndex(x=>/^ingredientes?\s*:?$/i.test(x)),end=rows.findIndex(x=>/^(preparaci[oó]n|instrucciones|elaboraci[oó]n)\s*:?$/i.test(x));let name=rows[0],ins=(start>=0?rows.slice(start+1,end>start?end:undefined):[]).map(x=>x.replace(/^[-•]\s*/,'')),steps=(end>=0?rows.slice(end+1):[]).map(x=>x.replace(/^\d+[.)-]\s*/,''));let obj={id:eid(),name,description:'Importada a partir de texto; revisar antes de guardar.',emoji:'🥗',categories:['Comidas'],ingredients:parseIngredients(ins.join('\n')),instructions:steps,servings:4,time:30,iron:'',source:'',favorite:false};state.recipes.push(obj);save();openForm(obj.id)}render();
</script></body></html>
